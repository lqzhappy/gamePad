name: Node Build
on:
  push:
    branches: [t2]
  pull_request:

jobs:
  build:
    runs-on: orangepiplus5-docker   # 必须匹配你 Runner 的标签
    steps:
      #- uses: actions/checkout@v4
      - uses: admin/actions-checkout@v4

      - name: Setup Node
        #uses: actions/setup-node@v4
        uses: admin/actions-setup-node@v4
        cache: 'npm'

        #with:
         # node-version: '22'

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "dir=$(npm config get cache)" >> "$GITEA_OUTPUT"

      - name: Cache npm
        #uses: actions/cache@v4
        uses: admin/actions-cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-


      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: admin/actions-upload-artifact@v4
        with:
          name: dist
          path: dist/